<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heartland Basketball Scoreboard</title>
<style>
:root{--heartland:#0A0674;--plaza:#8B2635;--black:#151719;--white:#F4F5F4}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
#stage{position:relative;width:100vw;height:100vh}
#bug{position:absolute;left:50%;bottom:5.2%;transform:translateX(-50%);height:88px;display:flex;white-space:nowrap;filter:drop-shadow(0 3px 3px rgba(0,0,0,.32))}
.team{height:88px;display:flex;align-items:stretch}
.info{height:88px;width:255px;display:flex;flex-direction:column;justify-content:center;padding:0 22px}
.top{display:flex;align-items:center;gap:9px;line-height:1}
.seed{font-size:19px;font-weight:900}
.name{font-size:22px;font-weight:900;letter-spacing:.35px}
.record{font-size:16px;font-weight:800;margin-top:7px;opacity:.96}
.score{position:relative;overflow:hidden!important;isolation:isolate;height:88px;width:92px;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:900;font-variant-numeric:tabular-nums}
.home .info{background:var(--heartland);color:#fff}.home .score{background:var(--heartland)!important;color:#fff;border-left:1px solid rgba(255,255,255,.28);box-shadow:none}.home .info{border-radius:3px 0 0 3px;align-items:flex-end}.home .top{justify-content:flex-end}
.away .info{background:var(--white);color:var(--plaza)}.away .score{background:#E9EAEB;color:var(--plaza);border-right:1px solid rgba(90,90,90,.22);box-shadow:inset -7px 0 12px rgba(0,0,0,.025)}.away .info{border-radius:0 3px 3px 0;align-items:flex-start}
.center{height:88px;width:128px;background:var(--black);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.clock{font-size:31px;line-height:32px;font-weight:900;font-variant-numeric:tabular-nums}.period{font-size:18px;font-weight:900;margin-top:7px}
@media(max-width:900px){#bug{height:70px}.team,.info,.score,.center{height:70px}.info{width:220px;padding:0 14px}.seed{font-size:14px}.name{font-size:18px}.record{font-size:12px;margin-top:5px}.score{width:70px;font-size:42px}.center{width:102px}.clock{font-size:24px;line-height:25px}.period{font-size:14px;margin-top:5px}}
.score .score-current,.score .score-old{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.score .score-old{opacity:0;pointer-events:none}.score.cross .score-current{animation:newScore .65s ease-in-out both}.score.cross .score-old{animation:oldScore .65s ease-in-out both}
@keyframes oldScore{0%{opacity:1;transform:scale(1)}45%{opacity:.45;transform:scale(.985)}100%{opacity:0;transform:scale(.97)}}
@keyframes newScore{0%{opacity:0;transform:scale(1.025)}30%{opacity:.18}58%{opacity:.7}100%{opacity:1;transform:scale(1)}}
.home .score,.home #homeScore{background:#0A0674!important;}
.score-flash{position:absolute;left:-30%;top:-30%;width:160%;height:160%;background:#fff!important;display:none;align-items:center;justify-content:center;z-index:50;overflow:hidden;pointer-events:none;opacity:1;backface-visibility:hidden;transform:translate3d(72%,-72%,0) rotate(18deg) scale(.42);transform-origin:50% 50%;will-change:transform,opacity;contain:paint;clip-path:polygon(8% 0,100% 0,100% 92%,92% 100%,0 100%,5% 88%,0 79%,8% 70%,1% 61%,10% 52%,2% 43%,11% 34%,3% 25%,12% 16%,5% 8%)}
.homeflash{background:#FFFFFF!important;} .awayflash{background:#FFFFFF!important;} .score-flash .hcs-logo{display:block;position:absolute;left:50%;top:51%;width:82%!important;height:82%!important;transform:translate3d(-50%,-50%,0) perspective(240px) rotateX(7deg) rotateY(-9deg) scale(.86);transform-origin:50% 50%;max-width:none!important;max-height:none!important;object-fit:contain!important;object-position:center!important;background:#fff!important;opacity:1!important;filter:drop-shadow(0 7px 5px rgba(0,0,0,.30)) drop-shadow(0 2px 1px rgba(0,0,0,.18));mix-blend-mode:normal!important;will-change:transform;backface-visibility:hidden;image-rendering:auto}
.score-flash .phmark{display:block;position:absolute;left:50%;top:50%;transform:translate3d(-50%,-50%,0) perspective(240px) rotateX(7deg) rotateY(-9deg) scale(.86);transform-origin:50% 50%;font-size:50px;line-height:1;font-weight:900;color:#8B2635;opacity:1;text-shadow:0 7px 5px rgba(0,0,0,.30),0 2px 1px rgba(0,0,0,.18);will-change:transform;backface-visibility:hidden}

.tear-curtain{position:absolute;inset:0;z-index:70;pointer-events:none;display:none;overflow:hidden;background:#fff;will-change:clip-path}
.tear-curtain::before{content:"";position:absolute;inset:0;background:#fff}

.score-flash::after{content:"";position:absolute;left:50%;top:50%;width:58%;height:58%;transform:translate3d(-50%,-50%,0) translateX(-80%) skewX(-18deg);background:linear-gradient(100deg,transparent 34%,rgba(255,255,255,0) 42%,rgba(255,255,255,.52) 50%,rgba(255,255,255,.10) 57%,transparent 66%);mix-blend-mode:screen;opacity:0;pointer-events:none;will-change:transform,opacity;z-index:4}
.score-flash .hcs-logo,.score-flash .phmark{z-index:3}

<script>
const defaults={homeName:"HEARTLAND",awayName:"PLAZA HEIGHTS",homeScore:0,awayScore:0,period:1,seconds:480,running:false,stamp:Date.now()};
function read(){try{return {...defaults,...JSON.parse(localStorage.getItem("htv-score")||"{}")}}catch(e){return {...defaults}}}
function ord(n){return n===1?"1ST":n===2?"2ND":n===3?"3RD":n===4?"4TH":n===5?"OT":n+"OT"}
function stateNow(){let s=read();if(s.running){let e=Math.floor((Date.now()-s.stamp)/1000);s.seconds=Math.max(0,s.seconds-e);if(s.seconds===0)s.running=false}return s}
function setScore(el,val){
 const cur=el.querySelector(".score-current"),flash=el.querySelector(".score-flash"),curtain=el.querySelector(".tear-curtain");
 const mark=flash.querySelector(".hcs-logo,.phmark"),next=String(val);
 if(cur.textContent===next)return;
 if(el.dataset.busy==="1"){el.dataset.pending=next;return}
 el.dataset.busy="1";
 flash.getAnimations().forEach(a=>a.cancel());
 if(mark) mark.getAnimations().forEach(a=>a.cancel());
 flash.style.display="none";
 flash.style.opacity="1";
 if(curtain){
   curtain.style.display="block";
   const sheet=curtain.animate([
     {offset:0,clipPath:"polygon(100% 0,100% 0,100% 0)"},
     {offset:.18,clipPath:"polygon(82% 0,100% 0,100% 24%,96% 20%,92% 27%,88% 22%,84% 31%,80% 26%)"},
     {offset:.38,clipPath:"polygon(58% 0,100% 0,100% 50%,96% 45%,91% 54%,86% 48%,81% 59%,75% 52%,70% 64%,64% 57%,59% 69%,53% 62%)"},
     {offset:.62,clipPath:"polygon(30% 0,100% 0,100% 78%,95% 71%,90% 82%,84% 75%,78% 88%,71% 80%,64% 94%,57% 86%,50% 100%,0 100%,0 31%,7% 35%,12% 27%,18% 33%,23% 22%)"},
     {offset:.82,clipPath:"polygon(8% 0,100% 0,100% 100%,0 100%,0 8%,5% 12%)"},
     {offset:1,clipPath:"polygon(0 0,100% 0,100% 100%,0 100%)"}
   ],{duration:175,easing:"cubic-bezier(.18,.72,.2,1)",fill:"forwards"});
   sheet.onfinish=()=>{};
 }

 // BEAT 1: very fast diagonal rip/tornado into the score box.
 const tearIn=flash.animate([
   {offset:0,transform:"translate3d(92%,-92%,0) rotate(27deg) scale(.24)"},
   {offset:.22,transform:"translate3d(55%,-55%,0) rotate(18deg) scale(.48)"},
   {offset:.52,transform:"translate3d(20%,-20%,0) rotate(9deg) scale(.76)"},
   {offset:.78,transform:"translate3d(2%,-2%,0) rotate(2deg) scale(.98)"},
   {offset:1,transform:"translate3d(0,0,0) rotate(0deg) scale(1)"}
 ],{duration:175,easing:"cubic-bezier(.12,.75,.18,1)",fill:"forwards"});

 tearIn.onfinish=()=>{
   // Rake/erase is complete. Hold a completely clean white score box first.
   cur.textContent=next;
   if(curtain){
     curtain.style.background="#fff";
     curtain.style.clipPath="inset(0)";
   }
   setTimeout(()=>{
     // Remove the rake layer first, then reveal the logo on the next paint.
     // This prevents a leftover white rake streak from flashing across the horse.
     if(curtain) curtain.style.display="none";
     requestAnimationFrame(()=>{
       flash.style.display="flex";
       if(mark){
       mark.animate([
       {offset:0,transform:"translate3d(-50%,-50%,0) perspective(240px) rotateX(2deg) rotateY(-2deg) scale(1.08)"},
       {offset:.58,transform:"translate3d(-50%,-50%,0) perspective(240px) rotateX(0deg) rotateY(0deg) scale(1.18)"},
       {offset:.82,transform:"translate3d(-50%,-50%,0) perspective(240px) rotateX(-1deg) rotateY(1deg) scale(1.22)"},
       {offset:1,transform:"translate3d(-50%,-50%,0) perspective(240px) rotateX(0deg) rotateY(0deg) scale(1.19)"}
     ],{duration:300,easing:"cubic-bezier(.16,.58,.22,1)",fill:"forwards"});
       }
     });

   setTimeout(()=>{
     // BEAT 3: second white tornado/rip rapidly grabs the logo and tears it away.
     const tearOut=flash.animate([
       {offset:0,transform:"translate3d(0,0,0) rotate(0deg) scale(1)"},
       {offset:.18,transform:"translate3d(-4%,4%,0) rotate(-3deg) scale(1.07)"},
       {offset:.42,transform:"translate3d(-18%,18%,0) rotate(-9deg) scale(.98)"},
       {offset:.68,transform:"translate3d(-48%,48%,0) rotate(-18deg) scale(.72)"},
       {offset:.88,transform:"translate3d(-78%,78%,0) rotate(-26deg) scale(.46)"},
       {offset:1,transform:"translate3d(-104%,104%,0) rotate(-31deg) scale(.25)"}
     ],{duration:185,easing:"cubic-bezier(.34,0,.2,1)",fill:"forwards"});
     if(mark){
       mark.animate([
         {offset:0,transform:"translate3d(-50%,-50%,0) perspective(240px) rotateX(0deg) rotateY(0deg) scale(1.19)"},
         {offset:.35,transform:"translate3d(-50%,-50%,0) perspective(240px) rotateX(-2deg) rotateY(3deg) scale(1.23)"},
         {offset:1,transform:"translate3d(-50%,-50%,0) perspective(240px) rotateX(6deg) rotateY(10deg) scale(.90)"}
       ],{duration:185,easing:"ease-in",fill:"forwards"});
     }
     tearOut.onfinish=()=>{
       flash.style.display="none";
       el.dataset.busy="0";
       const pending=el.dataset.pending;
       if(pending!==undefined){delete el.dataset.pending;if(pending!==cur.textContent)setScore(el,pending)}
     };
   },300);
   },110);
 };
}
function draw(){const s=stateNow();homeName.textContent=s.homeName==="HCS"?"HEARTLAND":(s.homeName||"HEARTLAND");awayName.textContent=s.awayName==="GUEST"?"PLAZA HEIGHTS":(s.awayName||"PLAZA HEIGHTS");setScore(homeScore,s.homeScore);setScore(awayScore,s.awayScore);period.textContent=ord(s.period);let m=Math.floor(s.seconds/60),q=s.seconds%60;clock.textContent=m+":"+String(q).padStart(2,"0")}
draw();setInterval(draw,200);window.addEventListener("storage",draw);
