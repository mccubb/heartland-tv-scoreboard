<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heartland TV Scorebug</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
#stage{position:relative;width:100vw;height:100vh}
#bug{position:absolute;left:50%;bottom:4.8%;transform:translateX(-50%);height:76px;display:flex;align-items:stretch;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28));white-space:nowrap}
.team{display:flex;align-items:center;height:76px}
.name{height:76px;display:flex;align-items:center;padding:0 19px;font-size:24px;font-weight:800;letter-spacing:.7px}
.score{width:74px;height:76px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;font-variant-numeric:tabular-nums}
.home .name{background:#174F86;color:#fff;border-radius:5px 0 0 5px}
.home .score{background:#fff;color:#101820}
.away .score{background:#fff;color:#101820;border-left:1px solid #d8dde2}
.away .name{background:#252a30;color:#fff}
.game{height:76px;min-width:108px;background:#101820;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:0 5px 5px 0;padding:0 16px}
.clock{font-size:28px;font-weight:900;line-height:30px;font-variant-numeric:tabular-nums}
.period{font-size:14px;font-weight:800;letter-spacing:1.2px;color:#d8e6f4;margin-top:4px}
.brand{position:absolute;top:-20px;left:0;height:20px;background:#0f355a;color:#fff;font-size:11px;font-weight:800;letter-spacing:1.5px;padding:4px 10px;border-radius:3px 3px 0 0}
@media(max-width:900px){#bug{height:62px}.team,.name,.score,.game{height:62px}.name{font-size:18px;padding:0 13px}.score{font-size:34px;width:61px}.game{min-width:90px}.clock{font-size:23px}.period{font-size:11px}}
</style></head>
<body><div id="stage"><div id="bug"><div class="brand">HEARTLAND TV</div>
<div class="team home"><div class="name" id="homeName">HEARTLAND</div><div class="score" id="homeScore">0</div></div>
<div class="team away"><div class="score" id="awayScore">0</div><div class="name" id="awayName">GUEST</div></div>
<div class="game"><div class="clock" id="clock">8:00</div><div class="period" id="period">1ST</div></div>
</div></div>
<script>
const defaults={homeName:"HEARTLAND",awayName:"GUEST",homeScore:0,awayScore:0,period:1,seconds:480,running:false,stamp:Date.now()};
function read(){try{return {...defaults,...JSON.parse(localStorage.getItem("htv-score")||"{}")}}catch(e){return {...defaults}}}
function ord(n){return n===1?"1ST":n===2?"2ND":n===3?"3RD":n===4?"4TH":n+"TH"}
function stateNow(){let s=read();if(s.running){let elapsed=Math.floor((Date.now()-s.stamp)/1000);s.seconds=Math.max(0,s.seconds-elapsed);if(s.seconds===0)s.running=false}return s}
function draw(){const s=stateNow();homeName.textContent=s.homeName;awayName.textContent=s.awayName;homeScore.textContent=s.homeScore;awayScore.textContent=s.awayScore;period.textContent=ord(s.period);let m=Math.floor(s.seconds/60),sec=s.seconds%60;clock.textContent=m+":"+String(sec).padStart(2,"0")}
draw();setInterval(draw,200);window.addEventListener("storage",draw);
</script></body></html>
