<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heartland TV Volleyball — Color Broadcast Bar</title>
<style>
:root{--w:1220px;--h:82px;--bottom:6%;--home:#153d70;--homeDark:#0a2c57;--away:#bd342a;--awayDark:#99231e}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial Black,Arial,Helvetica,sans-serif}
#stage{position:relative;width:100vw;height:100vh}
#scorebar{position:absolute;left:50%;bottom:var(--bottom);transform:translateX(-50%);width:var(--w);height:var(--h);display:grid;grid-template-columns:92px minmax(250px,1fr) 92px 174px 92px minmax(250px,1fr) 92px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));border-bottom:4px solid #d8d8d8;border-radius:3px;overflow:hidden}
.logo,.team,.score,.middle{height:100%;display:flex;align-items:center;position:relative;overflow:hidden}
.homeLogo{background:linear-gradient(90deg,#09264d,var(--homeDark));border-left:6px solid #e6e6e6}.homeTeam{background:linear-gradient(90deg,var(--homeDark),var(--home))}
.awayTeam{background:linear-gradient(90deg,var(--away),var(--awayDark))}.awayLogo{background:linear-gradient(90deg,var(--awayDark),#7e1714)}
.logo:after,.team:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 48%,rgba(0,0,0,.09)),repeating-linear-gradient(90deg,transparent 0 28px,rgba(255,255,255,.018) 29px 30px);pointer-events:none}
.logo{justify-content:center}.logo img{z-index:2;max-width:76px;max-height:66px;object-fit:contain}.initial{z-index:2;color:white;font-size:35px;font-weight:900;text-shadow:0 1px 1px #0006}
.awayLogo .initial{color:#fff}
.team{color:#fff;padding:0 18px}.teamline{z-index:2;width:100%;display:flex;align-items:baseline;gap:10px}.awayTeam .teamline{justify-content:flex-end}.rank{font-size:17px;font-weight:900}.name{font-size:25px;font-weight:900;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis}
.score{justify-content:center;background:linear-gradient(180deg,#fff,#ecece8);color:#0c0c0c;font-size:47px;font-weight:900;border-left:1px solid #c9c9c9;border-right:1px solid #c9c9c9;font-variant-numeric:tabular-nums}.score span{display:block}.score.flip span{animation:flip .24s ease-out}@keyframes flip{0%{transform:rotateX(-85deg);opacity:.2}100%{transform:rotateX(0);opacity:1}}
.middle{background:linear-gradient(180deg,#34383b,#222629);color:#fff;justify-content:center;flex-direction:column;text-align:center;padding:0 8px}.set{font-size:20px;line-height:1;font-weight:900}.lead{font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.1;font-weight:900;margin-top:7px;text-transform:uppercase;max-width:160px;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1000px){#scorebar{width:95vw;grid-template-columns:70px minmax(150px,1fr) 70px 140px 70px minmax(150px,1fr) 70px}.name{font-size:19px}.rank{font-size:14px}.score{font-size:39px}.set{font-size:16px}.lead{font-size:10px}}
</style></head><body><div id="stage"><div id="scorebar">
<div class="logo homeLogo"><img id="homeLogo"><span class="initial" id="homeInitial">P</span></div>
<div class="team homeTeam"><div class="teamline"><span class="rank" id="homeRank">15</span><span class="name" id="homeName">PENN STATE</span></div></div>
<div class="score" id="homeScore"><span>14</span></div>
<div class="middle"><div class="set" id="setText">2ND SET</div><div class="lead" id="leadText">USC LEADS 1 - 0</div></div>
<div class="score" id="awayScore"><span>23</span></div>
<div class="team awayTeam"><div class="teamline"><span class="rank" id="awayRank">5</span><span class="name" id="awayName">USC</span></div></div>
<div class="logo awayLogo"><img id="awayLogo"><span class="initial" id="awayInitial">SC</span></div>
</div></div>
<script>
'use strict';
const SK='htv-volleyball-score',BK='htv-volleyball-reference-brand';
const SD={homeScore:14,awayScore:23,homeSets:0,awaySets:1};
const BD={homeName:'PENN STATE',awayName:'USC',homeRank:'15',awayRank:'5',homeColor:'#153d70',homeDark:'#0a2c57',awayColor:'#bd342a',awayDark:'#99231e',gold:'#f2b516',homeLogo:'',awayLogo:'',width:1220,height:82,bottom:6};
function read(k,d){try{return {...d,...JSON.parse(localStorage.getItem(k)||'{}')}}catch{return {...d}}}
function ord(n){return n===1?'1ST':n===2?'2ND':n===3?'3RD':n+'TH'}
function score(side,v){const el=document.getElementById(side+'Score'),sp=el.querySelector('span'),n=String(v??0);if(sp.textContent!==n){sp.textContent=n;el.classList.remove('flip');void el.offsetWidth;el.classList.add('flip')}}
function logo(side,b){const img=document.getElementById(side+'Logo'),ini=document.getElementById(side+'Initial'),src=b[side+'Logo'];if(src){img.src=src;img.style.display='block';ini.style.display='none'}else{img.style.display='none';ini.style.display='block';ini.textContent=(side==='away'&&b.awayName.toUpperCase()==='USC')?'SC':(b[side+'Name']||'?').charAt(0).toUpperCase()}}
function draw(){const s=read(SK,SD),b=read(BK,BD),r=document.documentElement.style;r.setProperty('--w',Math.max(750,Math.min(1800,+b.width||1220))+'px');r.setProperty('--h',Math.max(55,Math.min(140,+b.height||82))+'px');r.setProperty('--bottom',Math.max(0,Math.min(35,+b.bottom||6))+'%');r.setProperty('--home',b.homeColor);r.setProperty('--homeDark',b.homeDark);r.setProperty('--away',b.awayColor);r.setProperty('--awayDark',b.awayDark);homeName.textContent=b.homeName.toUpperCase();awayName.textContent=b.awayName.toUpperCase();homeRank.textContent=b.homeRank;awayRank.textContent=b.awayRank;homeRank.style.display=b.homeRank?'inline':'none';awayRank.style.display=b.awayRank?'inline':'none';logo('home',b);logo('away',b);score('home',s.homeScore);score('away',s.awayScore);const setNo=Math.max(1,Math.min(5,(+s.homeSets||0)+(+s.awaySets||0)+1));setText.textContent=ord(setNo)+' SET';leadText.textContent=''}
draw();addEventListener('storage',e=>{if(e.key===SK||e.key===BK)draw()});setInterval(draw,300);
</script></body></html>
