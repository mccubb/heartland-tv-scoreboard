<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heartland TV Volleyball</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#182334;font-family:Arial,Helvetica,sans-serif}main{max-width:1200px;margin:auto;padding:24px}header{background:#174f86;color:white;padding:20px 24px;border-radius:10px}h1{margin:0;font-size:24px}.links{margin:16px 0}.preview{background:#16191e;border-radius:10px;padding:75px 15px;display:flex;justify-content:center;overflow:hidden}
#board{width:var(--w,1000px);height:var(--h,62px);display:grid;grid-template-columns:330fr 80fr 145fr 80fr 330fr;overflow:hidden;border-radius:5px;box-shadow:0 3px 6px #0006;font-weight:900;white-space:nowrap}
.team{height:100%;display:flex;align-items:center;color:white;min-width:0}.left{background:var(--lc,#173c66)}.right{background:var(--rc,#a83c31)}.logoBox{width:76px;min-width:76px;height:100%;display:grid;place-items:center;background:#0002}.right .logoBox{order:2}.logo{max-width:64px;max-height:52px;object-fit:contain}.fallback{font-size:28px}.teamInfo{min-width:0;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px}.seed{font-size:12px;opacity:.95}.teamName{font-size:21px;overflow:hidden;text-overflow:ellipsis}.score{height:100%;background:#f4f3ed;color:#151719;display:grid;place-items:center;font-size:39px;font-style:italic;font-variant-numeric:tabular-nums}.score.bump{animation:bump .2s ease-out}@keyframes bump{50%{transform:scale(1.12)}}
.mid{height:100%;background:#292d31;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.set{font-size:16px}.series{font-size:9px;margin-top:3px;letter-spacing:.1px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.card{background:white;padding:18px;border-radius:10px}h2{margin:0 0 12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;font-weight:700;margin:8px 0 4px}input{width:100%;padding:9px;border:1px solid #c8d0da;border-radius:6px;font:inherit}input[type=color]{height:42px;padding:3px}button{border:0;border-radius:6px;padding:10px 13px;margin:4px 2px;background:#174f86;color:#fff;font-weight:800;cursor:pointer}.minus{background:#536273}.danger{background:#a52d38}.overlayCard{margin-top:16px}.hint{font-size:13px;color:#586779}
body.overlay{background:transparent}body.overlay main{padding:0;max-width:none}body.overlay header,body.overlay .links,body.overlay .controls,body.overlay .overlayCard{display:none}body.overlay .preview{background:transparent;padding:0;display:block}body.overlay #board{position:fixed;left:var(--x,8%);bottom:var(--y,6%);width:var(--w,1000px);height:var(--h,62px)}
@media(max-width:800px){main{padding:10px}.controls{grid-template-columns:1fr}.preview{padding:45px 3px}#board{width:100%;height:56px;grid-template-columns:1fr 52px 105px 52px 1fr}.logoBox{width:52px;min-width:52px}.logo{max-width:45px;max-height:44px}.teamName{font-size:13px}.seed{font-size:8px}.score{font-size:29px}.set{font-size:12px}.series{font-size:7px}}
</style></head><body><main><header><h1>HEARTLAND TV · VOLLEYBALL</h1></header><p class="links"><a href="?overlay=1" target="_blank">Open transparent overlay</a> · <a href="camera.html" target="_blank">Camera reader</a></p>
<div class="preview"><div id="board">
<div class="team left" id="homeTeam"><div class="logoBox"><img id="homeLogo" class="logo"><span id="homeFallback" class="fallback"></span></div><div class="teamInfo"><span id="homeSeed" class="seed"></span><span id="homeName" class="teamName"></span></div></div>
<div id="homeScore" class="score"></div><div class="mid"><div id="setText" class="set"></div><div id="seriesText" class="series"></div></div><div id="awayScore" class="score"></div>
<div class="team right" id="awayTeam"><div class="logoBox"><img id="awayLogo" class="logo"><span id="awayFallback" class="fallback"></span></div><div class="teamInfo"><span id="awaySeed" class="seed"></span><span id="awayName" class="teamName"></span></div></div>
</div></div><div class="controls" id="controls"></div>
<section class="card overlayCard"><h2>Scoreboard size & position</h2><div class="pair"><label>Width<input id="width" type="number" min="500" max="1800"></label><label>Height<input id="height" type="number" min="40" max="160"></label><label>Left position %<input id="left" type="number" min="0" max="90"></label><label>Bottom position %<input id="bottom" type="number" min="0" max="90"></label></div><button id="reset" class="danger">Reset match</button><p class="hint">The controller and camera reader use the same score/set storage, so automatic camera updates still feed this new graphic.</p></section>
</main><script src="logo.js"></script><script>
const KEY='htv-volleyball-score',SIDES=['home','away'],$=x=>document.getElementById(x);
const D={homeName:'PENN STATE',awayName:'USC',homeScore:14,awayScore:23,homeSets:0,awaySets:1,home:{background:'#173c66',text:'#fff',ranking:'15',logo:'',fit:'contain'},away:{background:'#a83c31',text:'#fff',ranking:'5',logo:'',fit:'contain'},width:1000,height:62,left:8,bottom:6};
function get(){let o={};try{o=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}return {...D,...o,home:{...D.home,...o.home},away:{...D.away,...o.away}}}let old={};
function put(s){localStorage.setItem(KEY,JSON.stringify(s));draw()}function set(k,v){let s=get();s[k]=v;put(s)}function setB(side,k,v){let s=get();s[side][k]=v;put(s)}function n(k,v){set(k,Math.max(0,Math.min(k.endsWith('Sets')?9:99,+v||0)))}
for(const side of SIDES){let c=document.createElement('section');c.className='card';c.innerHTML=`<h2>${side==='home'?'Left':'Right'} team</h2><label>Team name<input id="${side}NameInput"></label><div class="pair"><label>Seed / ranking<input id="${side}ranking"></label><label>Team color<input id="${side}background" type="color"></label><label>Score<input id="${side}ScoreInput" type="number" min="0" max="99"></label><label>Sets won<input id="${side}SetsInput" type="number" min="0" max="9"></label></div><button data-k="${side}Score" data-d="1">+1 point</button><button class="minus" data-k="${side}Score" data-d="-1">−1 point</button><button data-k="${side}Sets" data-d="1">+1 set</button><button class="minus" data-k="${side}Sets" data-d="-1">−1 set</button><label>Team logo<input id="${side}file" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="${side}clear" class="minus">Clear logo</button>`;$('controls').append(c);
$(side+'NameInput').oninput=e=>set(side+'Name',e.target.value);$(side+'ranking').oninput=e=>setB(side,'ranking',e.target.value);$(side+'background').oninput=e=>setB(side,'background',e.target.value);$(side+'ScoreInput').onchange=e=>n(side+'Score',e.target.value);$(side+'SetsInput').onchange=e=>n(side+'Sets',e.target.value);$(side+'clear').onclick=()=>setB(side,'logo','');
$(side+'file').onchange=async e=>{let f=e.target.files[0];if(!f)return,u=URL.createObjectURL(f);try{let im=new Image();im.src=u;await im.decode();let q=Math.min(1,512/im.width,512/im.height),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*q));c.height=Math.max(1,Math.round(im.height*q));c.getContext('2d').drawImage(im,0,0,c.width,c.height);setB(side,'logo',c.toDataURL('image/png'))}finally{URL.revokeObjectURL(u);e.target.value=''}}}
function ord(n){return n==1?'1ST':n==2?'2ND':n==3?'3RD':n+'TH'}function draw(){let s=get();for(const side of SIDES){let b=s[side],team=$(side+'Team');team.style.background=b.background;team.style.color=b.text;$(side+'Name').textContent=s[side+'Name'];$(side+'Seed').textContent=b.ranking||'';let src=b.logo||(side==='home'?DEFAULT_LOGO:'');$(side+'Logo').hidden=!src;$(side+'Fallback').hidden=!!src;$(side+'Fallback').textContent=(s[side+'Name']||'?')[0];if(src&&$(side+'Logo').src!==src)$(side+'Logo').src=src;let sc=$(side+'Score');if(old[side]!==undefined&&old[side]!==s[side+'Score']){sc.classList.remove('bump');void sc.offsetWidth;sc.classList.add('bump')}sc.textContent=s[side+'Score'];old[side]=s[side+'Score'];$(side+'NameInput').value=s[side+'Name'];$(side+'ranking').value=b.ranking;$(side+'background').value=b.background;$(side+'ScoreInput').value=s[side+'Score'];$(side+'SetsInput').value=s[side+'Sets']}
let sn=Math.max(1,s.homeSets+s.awaySets+1);$('setText').textContent=ord(sn)+' SET';if(s.homeSets===s.awaySets)$('seriesText').textContent='MATCH TIED '+s.homeSets+' - '+s.awaySets;else{let lead=s.homeSets>s.awaySets?'home':'away';$('seriesText').textContent=(s[lead+'Name']||'').toUpperCase()+' LEADS '+s.homeSets+' - '+s.awaySets}
for(const k of ['width','height','left','bottom']){$(k).value=s[k];document.documentElement.style.setProperty(k==='left'?'--x':k==='bottom'?'--y':k==='width'?'--w':'--h',s[k]+(k==='left'||k==='bottom'?'%':'px'))}}
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let s=get();n(b.dataset.k,s[b.dataset.k]+ +b.dataset.d)});for(const k of ['width','height','left','bottom'])$(k).oninput=e=>set(k,+e.target.value||0);$('reset').onclick=()=>{if(confirm('Reset score and sets?')){let s=get();s.homeScore=s.awayScore=s.homeSets=s.awaySets=0;put(s)}};addEventListener('storage',e=>{if(e.key===KEY)draw()});if(new URLSearchParams(location.search).get('overlay')==='1')document.body.classList.add('overlay');draw();
</script></body></html>
