<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heartland TV Volleyball</title>
<style>
*{box-sizing:border-box}html,body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef1f5;color:#172033}main{max-width:1180px;margin:auto;padding:24px}header{background:#174f86;color:#fff;padding:20px 24px;border-radius:10px}h1{margin:0;font-size:24px}.tools{margin:18px 0}.stage{background:#171a20;border-radius:10px;padding:70px 18px;display:flex;justify-content:center;overflow:hidden}
.board{--w:1040px;--h:70px;width:var(--w);height:var(--h);display:grid;grid-template-columns:minmax(260px,1fr) 76px 150px 76px minmax(260px,1fr);font-family:Arial,Helvetica,sans-serif;filter:drop-shadow(0 3px 3px #0005);white-space:nowrap;overflow:hidden;border-radius:4px}
.team{min-width:0;height:100%;display:flex;align-items:center;color:#fff;background:var(--team);overflow:hidden}.team.left{border-left:5px solid #e9edf1}.team.right{border-right:5px solid #e9edf1}.logoWrap{height:100%;width:82px;min-width:82px;display:grid;place-items:center;background:#ffffff12}.logo{width:66px;height:58px;object-fit:contain}.fallback{font-weight:900;font-size:30px}.teamText{display:flex;align-items:center;gap:9px;min-width:0;padding:0 14px;flex:1}.right .teamText{justify-content:flex-end}.rank{font-size:13px;font-weight:900;opacity:.9}.name{font-size:22px;font-weight:900;overflow:hidden;text-overflow:ellipsis}.score{height:100%;display:grid;place-items:center;background:#f3f1e9;color:#17191c;font-size:40px;font-weight:900;font-variant-numeric:tabular-nums}.score.flip{animation:flip .25s ease-out}@keyframes flip{from{transform:rotateX(-85deg);opacity:.25}to{transform:none;opacity:1}}
.center{height:100%;background:#292d31;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.setTitle{font-size:16px;font-weight:900}.lead{font-size:10px;font-weight:900;margin-top:4px;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.card{background:#fff;padding:18px;border-radius:10px}h2{margin:0 0 12px}label{display:block;font-size:13px;font-weight:700;margin:9px 0 4px}input,select{width:100%;padding:9px;border:1px solid #c7cfda;border-radius:6px;font:inherit}input[type=color]{height:42px;padding:3px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:6px;padding:10px 13px;margin:4px 2px;background:#174f86;color:#fff;font-weight:800;cursor:pointer}.neutral{background:#536273}.red{background:#a52d38}.match{margin-top:16px}.note{font-size:13px;color:#536273}
body.overlay{background:transparent}body.overlay main{padding:0;max-width:none}body.overlay header,body.overlay .tools,body.overlay .grid,body.overlay .match{display:none}body.overlay .stage{padding:0;margin:0;background:transparent;display:block}body.overlay .board{position:fixed;left:var(--left,10%);bottom:var(--bottom,6%);width:var(--width,1040px);height:var(--height,70px)}
@media(max-width:800px){main{padding:10px}.grid{grid-template-columns:1fr}.stage{padding:40px 4px}.board{width:100%;grid-template-columns:minmax(140px,1fr) 55px 110px 55px minmax(140px,1fr);height:58px}.logoWrap{width:55px;min-width:55px}.logo{width:48px;height:46px}.teamText{padding:0 7px;gap:4px}.name{font-size:14px}.rank{font-size:9px}.score{font-size:31px}.setTitle{font-size:12px}.lead{font-size:8px;max-width:104px}}
</style></head><body><main>
<header><h1>HEARTLAND TV · VOLLEYBALL</h1></header>
<p class="tools"><a href="?overlay=1" target="_blank">Open transparent scoreboard</a> · <a href="camera.html" target="_blank">Camera automatic updates</a></p>
<div class="stage"><div class="board" id="board">
<div class="team left" id="homeTeam"><div class="logoWrap"><img class="logo" id="homeLogo"><div class="fallback" id="homeFallback"></div></div><div class="teamText"><span class="rank" id="homeRank"></span><span class="name" id="homeName"></span></div></div>
<div class="score" id="homeScore"></div>
<div class="center"><div class="setTitle" id="setTitle"></div><div class="lead" id="setLead"></div></div>
<div class="score" id="awayScore"></div>
<div class="team right" id="awayTeam"><div class="teamText"><span class="rank" id="awayRank"></span><span class="name" id="awayName"></span></div><div class="logoWrap"><img class="logo" id="awayLogo"><div class="fallback" id="awayFallback"></div></div></div>
</div></div>
<div class="grid" id="controls"></div>
<section class="card match"><h2>Match & overlay</h2><button id="next">New set — reset points</button><button id="reset" class="red">Reset match</button><div class="pair">
<label>Width (pixels)<input id="width" type="number" min="500" max="1800"></label><label>Height (pixels)<input id="height" type="number" min="45" max="180"></label>
<label>Left position (%)<input id="left" type="number" min="0" max="90"></label><label>Bottom position (%)<input id="bottom" type="number" min="0" max="90"></label></div>
<p class="note">Designed from scratch as a single college-broadcast-style volleyball bar. Width and height are independently adjustable.</p></section>
</main><script src="logo.js"></script><script>
'use strict';
const KEY='htv-volleyball-score',SIDES=['home','away'];
const defaults={homeName:'MUSTANGS',awayName:'OPPONENT',homeScore:0,awayScore:0,homeSets:0,awaySets:0,home:{background:'#173d66',text:'#ffffff',record:'',ranking:'',logo:'',fit:'contain'},away:{background:'#9e352d',text:'#ffffff',record:'',ranking:'',logo:'',fit:'contain'},width:1040,height:70,left:10,bottom:6};
const $=id=>document.getElementById(id);
function read(){let s={};try{s=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}return {...defaults,...s,home:{...defaults.home,...s.home},away:{...defaults.away,...s.away},height:s.height||70}}
let state=read(),prior={};
function save(s){localStorage.setItem(KEY,JSON.stringify(s));state=s;draw()}
function change(k,v){const s=read();s[k]=v;save(s)}
function brand(side,k,v){const s=read();s[side][k]=v;save(s)}
function num(k,v){change(k,Math.max(0,Math.min(k.endsWith('Sets')?9:99,Number(v)||0)))}
for(const side of SIDES){
 const card=document.createElement('section');card.className='card';
 card.innerHTML=`<h2>${side==='home'?'Left':'Right'} team</h2><label>Team name<input id="${side}NameInput"></label><div class="pair"><label>Ranking<input id="${side}ranking"></label><label>Sets won<input id="${side}SetsInput" type="number" min="0" max="9"></label></div><label>Points<input id="${side}ScoreInput" type="number" min="0" max="99"></label><button data-key="${side}Score" data-step="1">+1 point</button><button class="neutral" data-key="${side}Score" data-step="-1">−1 point</button><button data-key="${side}Sets" data-step="1">+1 set</button><button class="neutral" data-key="${side}Sets" data-step="-1">−1 set</button><div class="pair"><label>Team color<input id="${side}background" type="color"></label><label>Text color<input id="${side}text" type="color"></label></div><label>Logo<input id="${side}file" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="${side}clear" class="neutral">Default logo</button>`;
 $('controls').append(card);
 $(side+'NameInput').oninput=e=>change(side+'Name',e.target.value);
 $(side+'ranking').oninput=e=>brand(side,'ranking',e.target.value);
 $(side+'background').oninput=e=>brand(side,'background',e.target.value);
 $(side+'text').oninput=e=>brand(side,'text',e.target.value);
 for(const k of ['Score','Sets'])$(side+k+'Input').onchange=e=>num(side+k,e.target.value);
 $(side+'clear').onclick=()=>brand(side,'logo','');
 $(side+'file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);try{const im=new Image();im.src=u;await im.decode();const sc=Math.min(1,512/im.width,512/im.height),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);brand(side,'logo',c.toDataURL('image/png'))}finally{URL.revokeObjectURL(u);e.target.value=''}};
}
function ordinal(n){return n===1?'1ST':n===2?'2ND':n===3?'3RD':n+'TH'}
function draw(){state=read();
 for(const side of SIDES){const b=state[side],team=$(side+'Team');team.style.setProperty('--team',b.background);team.style.color=b.text;$(side+'Name').textContent=state[side+'Name'];$(side+'Rank').textContent=b.ranking||'';const src=b.logo||(side==='home'?DEFAULT_LOGO:'');$(side+'Logo').hidden=!src;$(side+'Fallback').hidden=!!src;$(side+'Fallback').textContent=(state[side+'Name']||'?').slice(0,1);if(src&&$(side+'Logo').src!==src)$(side+'Logo').src=src;const score=$(side+'Score');if(prior[side+'Score']!==undefined&&prior[side+'Score']!==state[side+'Score']){score.classList.remove('flip');void score.offsetWidth;score.classList.add('flip')}score.textContent=state[side+'Score'];prior[side+'Score']=state[side+'Score'];
  $(side+'NameInput').value=state[side+'Name'];$(side+'ranking').value=b.ranking;$(side+'background').value=b.background;$(side+'text').value=b.text;$(side+'ScoreInput').value=state[side+'Score'];$(side+'SetsInput').value=state[side+'Sets'];
 }
 const setNo=Math.max(1,state.homeSets+state.awaySets+1);$('setTitle').textContent=ordinal(setNo)+' SET';
 if(state.homeSets===state.awaySets)$('setLead').textContent='MATCH TIED '+state.homeSets+' - '+state.awaySets;else{const lead=state.homeSets>state.awaySets?'home':'away';$('setLead').textContent=(state[lead+'Name']||lead.toUpperCase())+' LEADS '+state.homeSets+' - '+state.awaySets}
 for(const k of ['width','height','left','bottom']){document.documentElement.style.setProperty('--'+k,state[k]+(['left','bottom'].includes(k)?'%':'px'));$(k).value=state[k]}
 $('board').style.setProperty('--w',state.width+'px');$('board').style.setProperty('--h',state.height+'px');
}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const s=read();num(b.dataset.key,s[b.dataset.key]+Number(b.dataset.step))});
$('next').onclick=()=>{const s=read();s.homeScore=s.awayScore=0;save(s)};
$('reset').onclick=()=>{if(confirm('Reset points and sets?')){const s=read();s.homeScore=s.awayScore=s.homeSets=s.awaySets=0;save(s)}};
for(const k of ['width','height','left','bottom'])$(k).oninput=e=>{const n=Number(e.target.value);if(Number.isFinite(n))change(k,n)};
window.addEventListener('storage',e=>{if(e.key===KEY)draw()});
if(new URLSearchParams(location.search).get('overlay')==='1')document.body.classList.add('overlay');
draw();
</script></body></html>
