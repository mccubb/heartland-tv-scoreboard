<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heartland TV Volleyball Scoreboard</title>
<style>
:root{--board-w:1120px;--board-h:78px;--bottom:5.5%;--home:#173a68;--home2:#0d2d55;--homeText:#fff;--away:#a82424;--away2:#8d171b;--awayText:#fff;--center:#292d31;--score:#f4f3ef;--scoreText:#111;--accent:#f2b20d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
#stage{position:relative;width:100vw;height:100vh}
#bug{position:absolute;left:50%;bottom:var(--bottom);transform:translateX(-50%);width:var(--board-w);height:var(--board-h);display:flex;align-items:stretch;white-space:nowrap;filter:drop-shadow(0 4px 4px rgba(0,0,0,.33))}
.teamColor,.logoBox{position:relative;overflow:hidden;color:#fff}
.teamColor:after,.logoBox:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,0) 46%,rgba(0,0,0,.09)),linear-gradient(105deg,transparent 0 42%,rgba(255,255,255,.045) 43% 44%,transparent 45% 61%,rgba(255,255,255,.03) 62% 63%,transparent 64%)}
.homeColor{background:linear-gradient(90deg,var(--home2),var(--home))}.awayColor{background:linear-gradient(90deg,var(--away),var(--away2))}
.logoBox{width:86px;min-width:86px;height:100%;display:flex;align-items:center;justify-content:center}.homeLogoBox{border-radius:3px 0 0 3px;background:linear-gradient(90deg,#0a2444,var(--home2))}.awayLogoBox{border-radius:0 3px 3px 0;background:linear-gradient(90deg,var(--away2),#741015)}
.logoBox img{position:relative;z-index:2;max-width:72px;max-height:62px;object-fit:contain}.logoInitial{position:relative;z-index:2;font-size:35px;font-weight:900;line-height:1}
.teamColor{height:100%;flex:1;min-width:0;display:flex;align-items:center}.homeTeam{padding:0 20px 0 15px}.awayTeam{padding:0 15px 0 20px}
.teamLine{position:relative;z-index:2;display:flex;align-items:baseline;gap:10px;min-width:0;width:100%}.awayTeam .teamLine{justify-content:flex-end}
.rank{font-size:15px;font-weight:900;line-height:1;flex:none;opacity:.98}.name{font-size:22px;font-weight:900;letter-spacing:.15px;line-height:1;overflow:hidden;text-overflow:ellipsis}
.score{width:80px;min-width:80px;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fbfbf9,#ecebe7);color:var(--scoreText);font-size:43px;font-weight:900;font-variant-numeric:tabular-nums;position:relative;overflow:hidden;border-left:1px solid rgba(0,0,0,.12);border-right:1px solid rgba(0,0,0,.12);box-shadow:inset 0 1px rgba(255,255,255,.9)}
.score .n{display:block}.score.flip .n{animation:scoreFlip .25s ease-out}@keyframes scoreFlip{0%{transform:rotateX(-82deg);opacity:.25}100%{transform:rotateX(0);opacity:1}}
.center{width:146px;min-width:146px;height:100%;background:linear-gradient(180deg,#31363a,#22262a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 7px;box-shadow:inset 0 1px rgba(255,255,255,.08)}
.setTitle{font-size:17px;font-weight:900;line-height:1}.lead{font-size:10px;font-weight:900;line-height:1.15;margin-top:6px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;max-width:132px}
.awayLogoBox:before{content:"";position:absolute;z-index:4;right:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ffd139,var(--accent) 60%,#c98400);box-shadow:-1px 0 0 rgba(255,255,255,.18)}
@media(max-width:900px){#bug{width:94vw}.logoBox{width:68px;min-width:68px}.score{width:65px;min-width:65px}.center{width:120px;min-width:120px}.name{font-size:18px}.rank{font-size:13px}}
</style></head>
<body><div id="stage"><div id="bug">
<div class="logoBox homeLogoBox" id="homeLogoBox"><img id="homeLogo" alt=""><span class="logoInitial" id="homeInitial">P</span></div>
<div class="teamColor homeColor homeTeam"><div class="teamLine"><span class="rank" id="homeRank">15</span><span class="name" id="homeName">PENN STATE</span></div></div>
<div class="score" id="homeScore"><span class="n">14</span></div>
<div class="center"><div class="setTitle" id="setTitle">2ND SET</div><div class="lead" id="lead">USC LEADS 1 - 0</div></div>
<div class="score" id="awayScore"><span class="n">23</span></div>
<div class="teamColor awayColor awayTeam"><div class="teamLine"><span class="rank" id="awayRank">5</span><span class="name" id="awayName">USC</span></div></div>
<div class="logoBox awayLogoBox" id="awayLogoBox"><img id="awayLogo" alt=""><span class="logoInitial" id="awayInitial">SC</span></div>
</div></div>
<script>
'use strict';
const SCORE_KEY='htv-volleyball-college-v2-score',BRAND_KEY='htv-volleyball-college-v2-brand';
const scoreDefaults={homeScore:14,awayScore:23,homeSets:0,awaySets:1};
const brandDefaults={homeName:'PENN STATE',awayName:'USC',home:{background:'#173a68',dark:'#0d2d55',text:'#ffffff',ranking:'15',logo:''},away:{background:'#a82424',dark:'#8d171b',text:'#ffffff',ranking:'5',logo:''},width:1120,height:78,bottom:5.5,accent:'#f2b20d'};
function scoreRead(){try{return {...scoreDefaults,...JSON.parse(localStorage.getItem(SCORE_KEY)||'{}')}}catch(e){return {...scoreDefaults}}}
function brandRead(){let s={};try{s=JSON.parse(localStorage.getItem(BRAND_KEY)||'{}')}catch(e){}return {...brandDefaults,...s,home:{...brandDefaults.home,...(s.home||{})},away:{...brandDefaults.away,...(s.away||{})}}}
function ord(n){return n===1?'1ST':n===2?'2ND':n===3?'3RD':n+'TH'}
function logo(side,b){const img=document.getElementById(side+'Logo'),initial=document.getElementById(side+'Initial'),src=b[side].logo||'';if(src){if(img.getAttribute('src')!==src)img.src=src;img.style.display='block';initial.style.display='none'}else{img.removeAttribute('src');img.style.display='none';initial.style.display='block';initial.textContent=side==='away'&&b.awayName.toUpperCase()==='USC'?'SC':(b[side+'Name']||'?').trim().charAt(0).toUpperCase()}}
function setScore(side,value){const box=document.getElementById(side+'Score'),span=box.querySelector('.n'),next=String(value??0);if(span.textContent!==next){span.textContent=next;box.classList.remove('flip');void box.offsetWidth;box.classList.add('flip')}}
function draw(){
 const s=scoreRead(),b=brandRead();
 document.documentElement.style.setProperty('--board-w',Math.max(650,Math.min(1800,+b.width||1120))+'px');
 document.documentElement.style.setProperty('--board-h',Math.max(54,Math.min(140,+b.height||78))+'px');
 document.documentElement.style.setProperty('--bottom',Math.max(0,Math.min(35,+b.bottom||5.5))+'%');
 document.documentElement.style.setProperty('--home',b.home.background);document.documentElement.style.setProperty('--home2',b.home.dark||b.home.background);document.documentElement.style.setProperty('--homeText',b.home.text);
 document.documentElement.style.setProperty('--away',b.away.background);document.documentElement.style.setProperty('--away2',b.away.dark||b.away.background);document.documentElement.style.setProperty('--awayText',b.away.text);document.documentElement.style.setProperty('--accent',b.accent||'#f2b20d');
 document.querySelector('.homeColor').style.color=b.home.text;document.getElementById('homeLogoBox').style.color=b.home.text;document.querySelector('.awayColor').style.color=b.away.text;document.getElementById('awayLogoBox').style.color=b.away.text;
 homeName.textContent=(b.homeName||'').toUpperCase();awayName.textContent=(b.awayName||'').toUpperCase();homeRank.textContent=b.home.ranking||'';awayRank.textContent=b.away.ranking||'';homeRank.style.display=b.home.ranking?'inline':'none';awayRank.style.display=b.away.ranking?'inline':'none';
 logo('home',b);logo('away',b);setScore('home',s.homeScore);setScore('away',s.awayScore);
 const setNo=Math.max(1,Math.min(5,(+s.homeSets||0)+(+s.awaySets||0)+1));setTitle.textContent=ord(setNo)+' SET';
 if(+s.homeSets===+s.awaySets)lead.textContent='MATCH TIED '+s.homeSets+' - '+s.awaySets;else{const who=(+s.homeSets>+s.awaySets)?'home':'away';lead.textContent=(b[who+'Name']||who.toUpperCase())+' LEADS '+s.homeSets+' - '+s.awaySets}
}
draw();window.addEventListener('storage',e=>{if(e.key===SCORE_KEY||e.key===BRAND_KEY)draw()});setInterval(draw,350);
</script></body></html>
