<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volleyball Control</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf0f3;font-family:Arial,sans-serif;color:#111}.wrap{max-width:1000px;margin:auto;padding:20px}.top{background:#123f70;color:#fff;padding:18px;border-radius:10px;margin-bottom:15px}.top b{font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{background:white;border-radius:10px;padding:17px;box-shadow:0 2px 7px #0001}.full{grid-column:1/-1}h2{margin:0 0 10px}label{display:block;font-weight:700;font-size:13px;margin-top:9px}input{width:100%;padding:10px;border:1px solid #c9d0d7;border-radius:6px;font-size:16px}input[type=color]{height:42px;padding:2px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}.big{font-size:48px;font-weight:900;text-align:center;margin:8px}.sets{font-size:22px;font-weight:900;text-align:center}.btns{text-align:center}button{border:0;border-radius:7px;background:#272c31;color:white;padding:11px 15px;font-weight:800;margin:4px;cursor:pointer}.blue{background:#154d82}.red{background:#a22626}.preview{width:55px;height:55px;object-fit:contain;background:#eee}.logoRow{display:flex;gap:10px;align-items:center;margin-top:8px}.links a{color:white}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:10px}}</style></head><body><div class="wrap">
<div class="top"><b>HEARTLAND TV — VOLLEYBALL</b><div class="links"><a href="./index.html?v=reference-red-blue-3" target="_blank">Open scoreboard</a> · <a href="./camera.html?v=reference-red-blue-3" target="_blank">Camera reader</a></div></div>
<div class="grid"><div class="card"><h2>LEFT TEAM</h2><label>Name<input id="homeName"></label><label>Ranking<input id="homeRank"></label><div class="big" id="homeScore">0</div><div class="btns"><button onclick="pt('home',-1)">−1</button><button class="blue" onclick="pt('home',1)">+1 POINT</button></div><div class="sets">Sets: <span id="homeSetsText">0</span></div><div class="btns"><button onclick="st('home',-1)">−1 SET</button><button class="blue" onclick="st('home',1)">+1 SET</button></div><div class="pair"><label>Blue / main color<input id="homeColor" type="color"></label><label>Dark blue<input id="homeDark" type="color"></label></div><label>Logo<input id="homeFile" type="file" accept="image/png,image/jpeg,image/webp"></label><div class="logoRow"><img id="homePreview" class="preview" hidden><button onclick="removeLogo('home')">Remove logo</button></div></div>
<div class="card"><h2>RIGHT TEAM</h2><label>Name<input id="awayName"></label><label>Ranking<input id="awayRank"></label><div class="big" id="awayScore">0</div><div class="btns"><button onclick="pt('away',-1)">−1</button><button class="blue" onclick="pt('away',1)">+1 POINT</button></div><div class="sets">Sets: <span id="awaySetsText">0</span></div><div class="btns"><button onclick="st('away',-1)">−1 SET</button><button class="blue" onclick="st('away',1)">+1 SET</button></div><div class="pair"><label>Red / main color<input id="awayColor" type="color"></label><label>Dark red<input id="awayDark" type="color"></label></div><label>Logo<input id="awayFile" type="file" accept="image/png,image/jpeg,image/webp"></label><div class="logoRow"><img id="awayPreview" class="preview" hidden><button onclick="removeLogo('away')">Remove logo</button></div></div>
<div class="card full"><h2>SIZE / POSITION</h2><div class="pair"><label>Width<input id="width" type="number" min="750" max="1800"></label><label>Height<input id="height" type="number" min="55" max="140"></label><label>Bottom %<input id="bottom" type="number" min="0" max="35" step=".5"></label><label>Team wrap color<input id="wrapColor" type="color"></label></div><div class="btns"><button class="blue" onclick="newSet()">NEW SET / RESET POINTS</button><button class="red" onclick="resetMatch()">RESET MATCH</button><button onclick="resetLook()">RESET TO PHOTO COLORS</button></div></div></div></div>
<script>
const SK='htv-volleyball-score',BK='htv-volleyball-reference-brand',SD={homeScore:14,awayScore:23,homeSets:0,awaySets:1},BD={homeName:'PENN STATE',awayName:'USC',homeRank:'15',awayRank:'5',homeColor:'#153d70',homeDark:'#0a2c57',awayColor:'#bd342a',awayDark:'#99231e',wrapColor:'#ffffff',gold:'#f2b516',homeLogo:'',awayLogo:'',width:1220,height:82,bottom:6};
function read(k,d){try{return {...d,...JSON.parse(localStorage.getItem(k)||'{}')}}catch{return {...d}}}function saveS(s){localStorage.setItem(SK,JSON.stringify(s));draw()}function saveB(b){localStorage.setItem(BK,JSON.stringify(b));draw()}function pt(x,n){const s=read(SK,SD),k=x+'Score';s[k]=Math.max(0,(+s[k]||0)+n);saveS(s)}function st(x,n){const s=read(SK,SD),k=x+'Sets';s[k]=Math.max(0,Math.min(3,(+s[k]||0)+n));saveS(s)}function newSet(){const s=read(SK,SD);s.homeScore=s.awayScore=0;saveS(s)}function resetMatch(){if(confirm('Reset the whole match?'))saveS({homeScore:0,awayScore:0,homeSets:0,awaySets:0})}function resetLook(){saveB({...BD})}
function bf(k,v){const b=read(BK,BD);b[k]=v;saveB(b)}async function upload(side,input){const f=input.files[0];if(!f)return;const u=URL.createObjectURL(f);try{const img=new Image();img.src=u;await img.decode();const scale=Math.min(1,512/img.naturalWidth,512/img.naturalHeight),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);bf(side+'Logo',c.toDataURL('image/png'))}finally{URL.revokeObjectURL(u);input.value=''}}function removeLogo(side){bf(side+'Logo','')}
for(const side of ['home','away']){document.getElementById(side+'Name').oninput=e=>bf(side+'Name',e.target.value.toUpperCase());document.getElementById(side+'Rank').oninput=e=>bf(side+'Rank',e.target.value);document.getElementById(side+'Color').oninput=e=>bf(side+'Color',e.target.value);document.getElementById(side+'Dark').oninput=e=>bf(side+'Dark',e.target.value);document.getElementById(side+'File').onchange=e=>upload(side,e.target)}for(const id of ['width','height','bottom'])document.getElementById(id).onchange=e=>bf(id,+e.target.value);wrapColor.oninput=e=>bf('wrapColor',e.target.value);
function draw(){const s=read(SK,SD),b=read(BK,BD);for(const side of ['home','away']){for(const k of ['Name','Rank']){const el=document.getElementById(side+k);if(document.activeElement!==el)el.value=b[side+k]}document.getElementById(side+'Score').textContent=s[side+'Score'];document.getElementById(side+'SetsText').textContent=s[side+'Sets'];document.getElementById(side+'Color').value=b[side+'Color'];document.getElementById(side+'Dark').value=b[side+'Dark'];const p=document.getElementById(side+'Preview');p.hidden=!b[side+'Logo'];if(b[side+'Logo'])p.src=b[side+'Logo']}for(const id of ['width','height','bottom'])if(document.activeElement!==document.getElementById(id))document.getElementById(id).value=b[id];document.getElementById('wrapColor').value=b.wrapColor||'#ffffff'}draw();addEventListener('storage',draw);setInterval(draw,400);
</script></body></html>
