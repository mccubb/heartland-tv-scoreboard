<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heartland TV Volleyball — College Scoreboard</title>
<style>
:root{--w:1120px;--h:82px;--left:#183c67;--right:#a52c24;--left-text:#fff;--right-text:#fff;--center:#292d31;--score:#f2f1ed;--score-text:#111;--accent:#f4b41b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
#stage{position:relative;width:100vw;height:100vh}
#bug{position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);width:var(--w);height:var(--h);display:flex;align-items:stretch;filter:drop-shadow(0 3px 4px rgba(0,0,0,.34));white-space:nowrap}
.logoBox{height:100%;width:10%;min-width:78px;display:flex;align-items:center;justify-content:center;background:var(--team-bg);color:var(--team-text);position:relative;overflow:hidden}
.logoBox img{max-width:82%;max-height:78%;object-fit:contain}.logoInitial{font-weight:900;font-size:calc(var(--h)*.44);line-height:1}
.teamInfo{height:100%;width:24%;display:flex;align-items:center;background:var(--team-bg);color:var(--team-text);overflow:hidden}
.leftInfo{padding:0 18px 0 10px}.rightInfo{padding:0 10px 0 18px}
.teamLine{display:flex;align-items:baseline;gap:10px;min-width:0;width:100%}.rank{font-size:calc(var(--h)*.19);font-weight:900;opacity:.95;flex:none}.name{font-size:calc(var(--h)*.27);font-weight:900;letter-spacing:.25px;overflow:hidden;text-overflow:ellipsis}.rightInfo .teamLine{justify-content:flex-end}
.score{height:100%;width:8%;min-width:76px;background:var(--score);color:var(--score-text);display:flex;align-items:center;justify-content:center;font-size:calc(var(--h)*.52);font-weight:900;font-variant-numeric:tabular-nums;position:relative;overflow:hidden;perspective:400px}
.score .n{display:block}.score.flip .n{animation:flip .28s ease-out}@keyframes flip{0%{transform:rotateX(-88deg);opacity:.25}100%{transform:rotateX(0);opacity:1}}
.center{height:100%;width:16%;min-width:140px;background:var(--center);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8px}
.setTitle{font-size:calc(var(--h)*.215);line-height:1;font-weight:900}.lead{font-size:calc(var(--h)*.125);line-height:1.15;font-weight:900;margin-top:7px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rightLogo:after{content:"";position:absolute;top:0;bottom:0;left:0;width:4px;background:var(--accent)}
.leftLogo{border-radius:3px 0 0 3px}.rightLogo{border-radius:0 3px 3px 0}
@media(max-width:900px){#bug{width:94vw}}
</style></head>
<body><div id="stage"><div id="bug">
  <div class="logoBox leftLogo" id="homeLogoBox"><img id="homeLogo" alt=""><span class="logoInitial" id="homeInitial">H</span></div>
  <div class="teamInfo leftInfo" id="homeInfo"><div class="teamLine"><span class="rank" id="homeRank"></span><span class="name" id="homeName">HEARTLAND</span></div></div>
  <div class="score" id="homeScore"><span class="n">0</span></div>
  <div class="center"><div class="setTitle" id="setTitle">1ST SET</div><div class="lead" id="lead">MATCH TIED 0-0</div></div>
  <div class="score" id="awayScore"><span class="n">0</span></div>
  <div class="teamInfo rightInfo" id="awayInfo"><div class="teamLine"><span class="rank" id="awayRank"></span><span class="name" id="awayName">OPPONENT</span></div></div>
  <div class="logoBox rightLogo" id="awayLogoBox"><img id="awayLogo" alt=""><span class="logoInitial" id="awayInitial">O</span></div>
</div></div>
<script>
const KEY='htv-volleyball-score';
const defaults={
 homeName:'HEARTLAND',awayName:'OPPONENT',homeScore:0,awayScore:0,homeSets:0,awaySets:0,currentSet:1,
 home:{background:'#183c67',text:'#ffffff',ranking:'',logo:''},
 away:{background:'#a52c24',text:'#ffffff',ranking:'',logo:''},
 width:1120,height:82,bottom:5.5,accent:'#f4b41b'
};
function read(){let s={};try{s=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};return {...defaults,...s,home:{...defaults.home,...(s.home||{})},away:{...defaults.away,...(s.away||{})}}}
function ord(n){return n===1?'1ST':n===2?'2ND':n===3?'3RD':n+'TH'}
let prev={};
function applyLogo(side,s){
 const img=document.getElementById(side+'Logo'),initial=document.getElementById(side+'Initial'),src=s[side].logo||'';
 if(src){img.src=src;img.style.display='block';initial.style.display='none'}else{img.removeAttribute('src');img.style.display='none';initial.style.display='block';initial.textContent=(s[side+'Name']||'?').trim().charAt(0).toUpperCase()}
}
function setScore(side,val){
 const box=document.getElementById(side+'Score'),span=box.querySelector('.n'),v=String(val??0);
 if(span.textContent!==v){span.textContent=v;box.classList.remove('flip');void box.offsetWidth;box.classList.add('flip')}
}
function draw(){
 const s=read();
 document.documentElement.style.setProperty('--w',Math.max(600,Math.min(1800,+s.width||1120))+'px');
 document.documentElement.style.setProperty('--h',Math.max(50,Math.min(150,+s.height||82))+'px');
 document.getElementById('bug').style.bottom=Math.max(0,Math.min(40,+s.bottom||5.5))+'%';
 document.documentElement.style.setProperty('--accent',s.accent||'#f4b41b');
 for(const side of ['home','away']){
   const info=document.getElementById(side+'Info'),logo=document.getElementById(side+'LogoBox');
   info.style.setProperty('--team-bg',s[side].background);info.style.setProperty('--team-text',s[side].text);
   logo.style.setProperty('--team-bg',s[side].background);logo.style.setProperty('--team-text',s[side].text);
   document.getElementById(side+'Name').textContent=(s[side+'Name']||'').toUpperCase();
   const r=document.getElementById(side+'Rank');r.textContent=s[side].ranking||'';r.style.display=s[side].ranking?'inline':'none';
   applyLogo(side,s);setScore(side,s[side+'Score']);
 }
 const setNo=Math.max(1,Math.min(9,+s.currentSet||(+s.homeSets||0)+(+s.awaySets||0)+1));
 document.getElementById('setTitle').textContent=ord(setNo)+' SET';
 if(+s.homeSets===+s.awaySets) document.getElementById('lead').textContent='MATCH TIED '+s.homeSets+' - '+s.awaySets;
 else {
   const side=(+s.homeSets>+s.awaySets)?'home':'away';
   document.getElementById('lead').textContent=(s[side+'Name']||side.toUpperCase())+' LEADS '+s.homeSets+' - '+s.awaySets;
 }
}
draw();window.addEventListener('storage',e=>{if(e.key===KEY)draw()});setInterval(draw,400);
</script></body></html>
